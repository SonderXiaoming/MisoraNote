name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.38.9"

jobs:
  validate-tag:
    name: Validate release tag
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Validate semantic version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use the vMAJOR.MINOR.PATCH format (for example, v1.2.3)." >&2
            exit 1
          fi
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  build-windows:
    name: Build Windows x64
    needs: validate-tag
    runs-on: windows-2022
    env:
      VERSION: ${{ needs.validate-tag.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release --build-name $env:VERSION --build-number $env:GITHUB_RUN_NUMBER

      - name: Package Windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive `
            -Path "build/windows/x64/runner/Release/*" `
            -DestinationPath "dist/misora_note_${env:GITHUB_REF_NAME}_windows_x64.zip"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v6
        with:
          name: windows-x64
          path: dist/*
          if-no-files-found: error

  build-macos:
    name: Build macOS
    needs: validate-tag
    runs-on: macos-15-intel
    env:
      VERSION: ${{ needs.validate-tag.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS
        run: flutter build macos --release --build-name "$VERSION" --build-number "$GITHUB_RUN_NUMBER"

      - name: Package macOS DMG
        shell: bash
        run: |
          set -euo pipefail
          app_path="build/macos/Build/Products/Release/misora_note.app"
          test -d "$app_path"
          mkdir -p dist/dmg-root
          ditto "$app_path" "dist/dmg-root/MisoraNote.app"
          ln -s /Applications dist/dmg-root/Applications
          hdiutil create \
            -volname "MisoraNote" \
            -srcfolder dist/dmg-root \
            -ov \
            -format UDZO \
            "dist/misora_note_${GITHUB_REF_NAME}_macos.dmg"
          rm -rf dist/dmg-root

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v6
        with:
          name: macos
          path: dist/*
          if-no-files-found: error

  build-android:
    name: Build Android
    needs: validate-tag
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.validate-tag.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android APKs
        run: flutter build apk --release --split-per-abi --build-name "$VERSION" --build-number "$GITHUB_RUN_NUMBER"

      - name: Build Android App Bundle
        run: flutter build appbundle --release --build-name "$VERSION" --build-number "$GITHUB_RUN_NUMBER"

      - name: Package Android
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "dist/misora_note_${GITHUB_REF_NAME}_armeabi-v7a.apk"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "dist/misora_note_${GITHUB_REF_NAME}_arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk "dist/misora_note_${GITHUB_REF_NAME}_x86_64.apk"
          cp build/app/outputs/bundle/release/app-release.aab "dist/misora_note_${GITHUB_REF_NAME}.aab"

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v6
        with:
          name: android
          path: dist/*
          if-no-files-found: error

  build-ios:
    name: Build iOS (unsigned)
    needs: validate-tag
    runs-on: macos-15
    env:
      VERSION: ${{ needs.validate-tag.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS without code signing
        run: flutter build ios --release --no-codesign --build-name "$VERSION" --build-number "$GITHUB_RUN_NUMBER"

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/Payload
          ditto build/ios/iphoneos/Runner.app dist/Payload/Runner.app
          (
            cd dist
            zip -qry "misora_note_${GITHUB_REF_NAME}_ios_unsigned.ipa" Payload
          )
          rm -rf dist/Payload

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v6
        with:
          name: ios-unsigned
          path: dist/*
          if-no-files-found: error

  build-linux:
    name: Build Linux x64
    needs: validate-tag
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.validate-tag.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            libgtk-3-dev \
            liblzma-dev \
            libstdc++-12-dev \
            ninja-build \
            pkg-config

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux
        run: flutter build linux --release --build-name "$VERSION" --build-number "$GITHUB_RUN_NUMBER"

      - name: Package Linux
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          tar -C build/linux/x64/release/bundle -czf "dist/misora_note_${GITHUB_REF_NAME}_linux_x64.tar.gz" .

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v6
        with:
          name: linux-x64
          path: dist/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs:
      - validate-tag
      - build-windows
      - build-macos
      - build-android
      - build-ios
      - build-linux
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA-256 checksums
        working-directory: dist
        shell: bash
        run: sha256sum * > SHA256SUMS.txt

      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            "misora_note_${GITHUB_REF_NAME}_windows_x64.zip"
            "misora_note_${GITHUB_REF_NAME}_macos.dmg"
            "misora_note_${GITHUB_REF_NAME}_armeabi-v7a.apk"
            "misora_note_${GITHUB_REF_NAME}_arm64-v8a.apk"
            "misora_note_${GITHUB_REF_NAME}_x86_64.apk"
            "misora_note_${GITHUB_REF_NAME}.aab"
            "misora_note_${GITHUB_REF_NAME}_ios_unsigned.ipa"
            "misora_note_${GITHUB_REF_NAME}_linux_x64.tar.gz"
            "SHA256SUMS.txt"
          )
          for asset in "${expected[@]}"; do
            test -s "dist/$asset" || {
              echo "Missing or empty release asset: $asset" >&2
              exit 1
            }
          done

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: false
